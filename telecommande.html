<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Télécommande du concert</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="noel/pochette-512.jpg">
<style>
:root { --bg: #1a1a1a; --line: #3a3733; --or: #c9ad68; --or2: #91804f; --mut: #b9b4aa; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: #fff; font: 16px/1.45 system-ui, sans-serif; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { opacity: .35; }
.top { display: flex; justify-content: space-between; align-items: center; color: var(--mut); font-size: 14px; }
.st { display: flex; align-items: center; gap: 8px; }
.st i { width: 9px; height: 9px; border-radius: 50%; background: #c0392b; }
.st.ok i { background: #3fb950; }
.cur { margin: 18px 0 10px; padding: 16px 18px; border: 1.5px solid var(--or); border-radius: 14px; }
.cur small { color: var(--or); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
.cur b { display: block; font-size: 24px; line-height: 1.25; margin-top: 4px; }
.btns { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.btns button { min-height: 92px; border-radius: 14px; font-size: 19px; font-weight: 600; border: 1.5px solid var(--line); }
.btns #nextB { background: var(--or); color: #1a1a1a; border-color: var(--or); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.modes button { min-height: 56px; border-radius: 12px; border: 1.5px solid var(--or2); color: var(--or); font-weight: 600; }
.modes button.on { background: var(--or); color: #1a1a1a; border-color: var(--or); }
.lock { display: block; width: 100%; margin-top: 10px; min-height: 52px; border-radius: 12px; border: 1px dashed var(--or2); color: var(--or); font-weight: 600; }
.lock.on { border-style: solid; background: rgba(201, 173, 104, .1); }
.help { color: var(--mut); font-size: 13.5px; margin: 8px 2px 0; }
h2 { margin: 24px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--or); }
ol { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
ol button { display: flex; gap: 10px; width: 100%; text-align: left; padding: 12px 6px; border-bottom: 1px solid var(--line); font-size: 15.5px; }
ol button.on { color: #1a1a1a; background: var(--or); border-radius: 8px; font-weight: 600; }
ol span:first-child { width: 22px; flex: none; text-align: right; opacity: .7; }
.reset { display: block; width: 100%; margin-top: 18px; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); color: var(--mut); font-size: 14.5px; }
.err { margin-top: 14px; padding: 12px; border-radius: 10px; background: #5c1f1f; }
</style>
</head>
<body>
<div class="top"><span>Télécommande · Concert de Noël</span><span class="st" id="st"><i></i><span id="stT">connexion…</span></span></div>
<div class="err" id="err" hidden></div>
<div class="cur"><small>Sur les téléphones</small><b id="curT">—</b></div>
<div class="btns"><button id="prevB" aria-label="Chant précédent">◀</button><button id="nextB">Chant suivant ▶</button></div>
<div class="modes"><button id="sayB">Saynète en cours</button><button id="accB">Accueil</button></div>
<button class="lock" id="lockB"></button>
<p class="help" id="help"></p>
<h2>Les chants</h2>
<ol id="list"></ol>
<button class="reset" id="resetB">Avant le concert (rien d’affiché)</button>
<audio id="au" playsinline></audio>

<script src="noel/programme.js"></script>
<script src="paroles/live.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), au = $('au'), N = NOEL.length;
  // le code est dans l'adresse après « # » (jamais envoyé ailleurs qu'au serveur du site)
  const K = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  let cur = -1, sending = false, want = null, lockOn = false, lastAct = '';

  const dernier = i => { const e = etatDe(i); return e.chant || e.apres || 0; };   // dernier chant atteint
  const nextOf = i => Math.min(N, dernier(i) + 1);
  const prevOf = i => { const e = etatDe(i); return e.chant ? Math.max(1, e.chant - 1) : e.apres ? e.apres : i; };
  const titre = n => `${n}. ${NOEL[n - 1].titre}`;
  function name(i) {
    const e = etatDe(i);
    if (e.chant) return titre(e.chant);
    if (e.saynete) return 'Saynète (entre deux chants)';
    if (e.accueil) return 'Accueil · « Bienvenue »';
    return 'Rien (avant le concert)';
  }

  function render() {
    const e = etatDe(cur);
    $('curT').textContent = name(cur);
    $('list').innerHTML = NOEL.map((s, k) => `<li><button data-n="${k + 1}" class="${e.chant === k + 1 ? 'on' : ''}"><span>${k + 1}</span><span>${s.titre}</span></button></li>`).join('');
    $('prevB').disabled = !(e.chant > 1 || e.apres);
    $('nextB').disabled = dernier(cur) >= N && !e.saynete && e.chant === N;
    $('sayB').className = e.saynete ? 'on' : ''; $('accB').className = e.accueil ? 'on' : '';
    $('resetB').disabled = cur < 0;
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: name(cur),
        artist: '⏭ ' + (dernier(cur) >= N && e.chant === N ? 'fin' : titre(nextOf(cur))),
        album: 'Télécommande · Concert de Noël',
        artwork: [{ src: new URL('noel/pochette-512.jpg', location.href).href, sizes: '512x512', type: 'image/jpeg' }],
      });
      handlers();
    }
  }
  // envoi au serveur ; les appuis rapides sont regroupés, le dernier gagne
  async function send(i) {
    cur = i; render(); want = i;
    if (sending) return;
    sending = true;
    while (want !== null) {
      const v = want; want = null;
      try {
        const r = await fetch('/live/etape', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ k: K, i: v }) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || r.status);
        $('err').hidden = true; status(true, j.n);
      } catch (e) { $('err').textContent = 'Non envoyé : ' + e.message + '. Réessayez.'; $('err').hidden = false; }
    }
    sending = false;
  }
  const status = (ok, n) => { $('st').className = 'st' + (ok ? ' ok' : ''); $('stT').textContent = ok ? `${n ?? '?'} connecté${n > 1 ? 's' : ''}` : 'hors ligne'; };
  let lastSkip = 0;
  const next = src => { if (Date.now() - lastSkip < 700) return; lastSkip = Date.now(); lastAct = src; send(nextOf(cur)); lockUI(); };
  const prev = src => { if (Date.now() - lastSkip < 700) return; lastSkip = Date.now(); lastAct = src; send(prevOf(cur)); lockUI(); };

  $('nextB').onclick = () => send(nextOf(cur));
  $('prevB').onclick = () => send(prevOf(cur));
  $('sayB').onclick = () => send(100 + dernier(cur));
  $('accB').onclick = () => send(0);
  $('resetB').onclick = () => { if (confirm('Revenir à « avant le concert » ? Plus rien ne sera affiché comme en cours.')) send(-1); };
  $('list').onclick = e => { const b = e.target.closest('button'); if (b && confirm('Passer au chant « ' + titre(+b.dataset.n) + ' » ?')) send(+b.dataset.n); };

  // écran verrouillé : un long son silencieux fait apparaître les commandes ⏮ ⏭ du téléphone
  const DUREE = 600;
  const SILENCE = (() => { const n = 8000 * DUREE, b = new DataView(new ArrayBuffer(44 + n)), w = (o, t) => [...t].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); b.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true); b.setUint32(24, 8000, true); b.setUint32(28, 8000, true); b.setUint16(32, 1, true); b.setUint16(34, 8, true); w(36, 'data'); b.setUint32(40, n, true);
    for (let i = 0; i < n; i++) b.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([b], { type: 'audio/wav' })); })();
  function lockUI() {
    $('lockB').className = 'lock' + (lockOn ? ' on' : '');
    $('lockB').textContent = lockOn ? '✓ Commandes sur l’écran verrouillé activées' : 'Activer les commandes sur l’écran verrouillé';
    $('help').textContent = lockOn ? 'Verrouillez le téléphone : ⏭ = chant suivant, ⏮ = chant précédent.' + (lastAct ? ' Dernière commande reçue : ' + lastAct + '.' : '') : 'À activer avant le concert. Laissez cette page ouverte.';
  }
  let startedAt = 0, lastT = 0;
  $('lockB').onclick = () => {
    if (lockOn) { lockOn = false; au.pause(); return lockUI(); }
    au.src = SILENCE; au.play().then(() => { lockOn = true; startedAt = Date.now(); lastT = 0; lockUI(); render(); }).catch(e => alert('Impossible : ' + e.message));
  };
  const restart = () => { au.currentTime = 0; lastT = 0; startedAt = Date.now(); au.play().catch(() => {}); };
  // secours : si le téléphone saute à la fin de la piste au lieu d'appeler « piste suivante », on le traite comme ⏭
  au.onended = () => { if (lockOn && Date.now() - startedAt < (DUREE - 5) * 1000) next('⏭ (fin de piste)'); restart(); };
  au.ontimeupdate = () => { const t = au.currentTime; if (lockOn && t - lastT > 20) { next('⏭ (saut avant)'); restart(); return; } lastT = t; };
  au.onpause = () => { if (lockOn) au.play().catch(() => { lockOn = false; lockUI(); }); };   // le téléphone ne doit pas couper le lecteur
  function handlers() {
    if (!('mediaSession' in navigator)) return;
    const on = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    on('nexttrack', () => next('⏭'));
    on('previoustrack', () => prev('⏮'));
    on('play', () => au.play()); on('pause', () => {});   // « pause » ne coupe pas la télécommande
    for (const a of ['seekbackward', 'seekforward', 'seekto', 'skipad']) on(a, null);   // sinon ±10 s à la place de ⏮ ⏭
  }
  handlers();
  au.addEventListener('playing', handlers);

  if (!K) { $('err').textContent = 'Adresse incomplète : utilisez le lien de télécommande complet (avec #k=…).'; $('err').hidden = false; }
  liveConnect(e => { if (!sending && want === null) { cur = e.i; render(); } status(true, e.n); });
  window.addEventListener('offline', () => status(false));
  lockUI(); render();
})();
</script>
</body>
</html>
