<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concert de Noël — Les paroles</title>
<meta name="description" content="Concert de Noël du chœur scout Adjuva Nos : les paroles de chaque chant.">
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="noel/pochette-512.jpg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #1a1a1a; --line: #3a3733; --or: #c9ad68; --or2: #91804f; --txt: #fff; --mut: #b9b4aa; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.5 Poppins, system-ui, sans-serif; overflow-x: hidden; padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; text-align: left; }
:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
.flakes { position: fixed; inset: 0; pointer-events: none; z-index: -1; color: var(--or2); }
.flakes svg { position: absolute; opacity: .16; }
.poster { margin: 0 -16px; position: relative; aspect-ratio: 1413 / 1500; overflow: hidden; }
.poster img { width: 100%; height: auto; display: block; }
.poster::after { content: ''; position: absolute; inset: auto 0 0; height: 6%; background: linear-gradient(transparent, var(--bg)); }
h1 { font: 600 clamp(40px, 11vw, 54px)/1 Caveat, cursive; margin: 4px 0 6px; }
.sub { margin: 0 0 18px; color: var(--mut); font-size: 14.5px; }
.now { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 12px; padding: 6px 14px; border-radius: 99px; border: 1px solid var(--or2); color: var(--mut); font-size: 13.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--or); flex: none; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
ol { list-style: none; margin: 0; padding: 0; }
.welcome { margin: 0 0 18px; padding: 18px 18px 20px; border: 1.5px solid var(--or); border-radius: 14px; background: rgba(201, 173, 104, .07); text-align: center; }
.welcome b { display: block; font: 600 44px/1 Caveat, cursive; color: var(--or); }
.welcome p { margin: 8px 0 0; color: var(--mut); font-size: 14.5px; }
.welcome .cd { margin: 12px 0 2px; color: var(--txt); font-size: 15px; }
.welcome .cd strong { display: block; font-size: 30px; font-weight: 600; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.song { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; width: 100%; min-height: 62px; padding: 8px 12px 8px 4px; border-bottom: 1px solid var(--line); border-radius: 0; }
.num { font: 600 38px/1 Caveat, cursive; color: var(--or); text-align: center; }
.song .t { font-weight: 500; line-height: 1.3; }
.song .go { color: var(--mut); font-size: 20px; }
.song.live { border: 1.5px solid var(--or); border-radius: 12px; background: rgba(201, 173, 104, .08); margin: 6px 0; }
.tag { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--or); }
footer { color: var(--mut); font-size: 13px; padding: 28px 0 8px; text-align: center; }
/* paroles */
.bar { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 4px; margin: 0 -16px; padding: 8px 16px 8px 6px; padding-top: max(8px, env(safe-area-inset-top)); background: rgba(26, 26, 26, .94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar.live { border-bottom-color: var(--or); }
.back { display: grid; place-items: center; width: 46px; height: 46px; flex: none; border-radius: 50%; color: var(--or); }
.back svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.back:active { background: rgba(201, 173, 104, .15); }
.bar .ttl { flex: 1; min-width: 0; padding: 2px 0 2px 4px; }
.bar .kick { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--or); }
.bar h2 { margin: 1px 0 0; font-size: 18px; font-weight: 600; line-height: 1.25; }
.onair { display: inline-flex; align-items: center; gap: 7px; flex: none; padding: 5px 11px; border-radius: 99px; background: rgba(201, 173, 104, .14); color: var(--or); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.lyrics.live { border-left: 2px solid var(--or); padding-left: 14px; margin-left: -16px; }
.part { margin: 26px 0 0; }
.part h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--or); }
.part h3 small { letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--mut); font-size: 13px; }
.part p { margin: 0; font-size: 18.5px; line-height: 1.6; }
.part.r p { font-style: italic; }
.lyrics { padding-bottom: 24px; }
/* bandeau « en ce moment » quand on lit un autre chant */
.pill { position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 5; display: flex; align-items: center; gap: 12px; max-width: 560px; margin: 0 auto; padding: 10px 14px 10px 16px; border-radius: 14px; border: 1px solid var(--or2); background: rgba(26, 26, 26, .92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 8px 28px rgba(0, 0, 0, .55); }
.pill .dot { flex: none; }
.pill .txt { flex: 1; min-width: 0; }
.pill small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--or); }
.pill .tt { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-size: 15px; }
.pill .go { color: var(--or); font-size: 24px; line-height: 1; }
</style>
</head>
<body>
<div class="flakes" id="flakes" aria-hidden="true"></div>
<div class="wrap">
  <section id="home">
    <div class="poster"><img src="noel/affiche.jpg" width="1413" height="2000" alt="Le chœur scout Adjuva Nos présente le concert de Noël"></div>
    <h1>Les paroles</h1>
    <p class="sub">Touchez un chant pour lire ses paroles. Le chant en cours est encadré.</p>
    <div class="welcome" id="welcome" hidden><b>Bienvenue !</b><p>Le concert va bientôt commencer.<br>Pensez à mettre votre téléphone en silencieux.</p><p class="cd" id="cd"></p></div>
    <div class="now" id="now" hidden></div>
    <ol id="list"></ol>
    <footer>Chœur scout Adjuva Nos · Concert de Noël · Église du Saint-Nom-de-Jésus, Lyon</footer>
  </section>
  <section id="text" hidden></section>
</div>
<button class="pill" id="pill" hidden></button>

<script src="noel/programme.js"></script>
<script src="paroles/textes.js"></script>
<script src="paroles/live.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const key = s => s.id || 'trois-routes';
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  let liveSong = -1, liveStep = {}, open = -1, lastLive = -1;

  function renderList() {
    $('list').innerHTML = NOEL.map((s, i) => `<li><button class="song${i === liveSong ? ' live' : ''}" data-i="${i}">
      <span class="num" aria-hidden="true">${i + 1}</span>
      <span><span class="t"><span hidden>Chant ${i + 1} : </span>${s.titre}</span>${i === liveSong ? '<br><span class="tag">En ce moment</span>' : ''}</span>
      <span class="go" aria-hidden="true">›</span></button></li>`).join('');
    $('now').hidden = !liveStep.saynete;
    $('now').innerHTML = '<span class="dot"></span>Entre deux chants';
    $('welcome').hidden = !liveStep.accueil;
    tick();
  }
  // compte à rebours de l'accueil
  function tick() {
    if (!liveStep.accueil) return;
    const s = Math.round((DEBUT_CONCERT - Date.now()) / 1000);
    if (s <= 0) { $('cd').innerHTML = '<strong>Installez-vous…</strong>'; return; }
    const j = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60, sec = s % 60, z = n => String(n).padStart(2, '0');
    $('cd').innerHTML = 'Début dans<strong>' + (j ? `${j} j ${h} h ${z(m)} min` : h ? `${h} h ${z(m)} min ${z(sec)} s` : `${m} min ${z(sec)} s`) + '</strong>';
  }
  setInterval(tick, 1000);
  function renderText(i) {
    const s = NOEL[i], parts = TEXTES[key(s)] || [];
    const live = i === liveSong;
    $('text').innerHTML = `<div class="bar${live ? ' live' : ''}"><button class="back" id="back" aria-label="Tous les chants"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ttl"><span class="kick">Chant ${i + 1}</span><h2>${s.titre}</h2></div>${live ? '<span class="onair"><span class="dot"></span>En cours</span>' : ''}</div>
      <div class="lyrics${live ? ' live' : ''}">${parts.map(p => `<div class="part${p.r ? ' r' : ''}"><h3>${p.t}${p.s ? ` <small>· ${p.s}</small>` : ''}</h3><p>${p.l.map(esc).join('<br>')}</p></div>`).join('')}</div>`;
  }
  // pastille uniquement sur la page d'un chant qui n'est pas celui chanté en ce moment
  function renderPill() {
    const show = open >= 0 && liveSong >= 0 && open !== liveSong;
    $('pill').hidden = !show;
    if (show) $('pill').innerHTML = `<span class="dot"></span><span class="txt"><small>En ce moment</small><span class="tt">${NOEL[liveSong].titre}</span></span><span class="go" aria-hidden="true">›</span>`;
  }
  // navigation : #3 = paroles du 3e chant (le bouton « retour » du téléphone fonctionne)
  function route() {
    const m = location.hash.match(/^#(\d+)$/), i = m ? +m[1] - 1 : -1;
    open = NOEL[i] ? i : -1;
    $('home').hidden = open >= 0; $('text').hidden = open < 0;
    if (open >= 0) { renderText(open); window.scrollTo(0, 0); } else renderList();
    renderPill();
  }
  let fromList = false;   // arrivé sur les paroles depuis la liste : « retour » = page précédente
  const go = i => { fromList = open < 0 && i >= 0; location.hash = i >= 0 ? '#' + (i + 1) : ''; };
  $('list').onclick = e => { const b = e.target.closest('.song'); if (b) go(+b.dataset.i); };
  $('text').onclick = e => {
    if (e.target.closest('#back')) { if (fromList) history.back(); else go(-1); return; }
  };
  $('pill').onclick = () => { if (liveSong >= 0) location.replace('#' + (liveSong + 1)); };
  window.addEventListener('hashchange', route);

  liveConnect(e => {
    liveStep = etatDe(e.i);
    liveSong = liveStep.chant && NOEL[liveStep.chant - 1] ? liveStep.chant - 1 : -1;
    // on lisait le chant qui était en direct et on passe au suivant : on suit automatiquement
    if (open >= 0 && open === lastLive && liveSong >= 0 && liveSong !== open) { if (liveSong >= 0) lastLive = liveSong; location.replace('#' + (liveSong + 1)); return; }
    if (liveSong >= 0) lastLive = liveSong;
    if (open >= 0) { const y = scrollY; renderText(open); scrollTo(0, y); } else renderList();
    renderPill();
  });

  const arm = '<path d="M50 50V6M50 18 40 8M50 18 60 8M50 30 38 18M50 30 62 18"/>';
  const flake = [0, 45, 90, 135, 180, 225, 270, 315].map(a => `<g transform="rotate(${a} 50 50)">${arm}</g>`).join('');
  $('flakes').innerHTML = [[78, 6, 80], [90, 40, 130], [-6, 58, 90], [70, 86, 70]].map(([x, y, w]) =>
    `<svg viewBox="0 0 100 100" width="${w}" height="${w}" style="left:${x}%;top:${y}%" fill="none" stroke="currentColor" stroke-width="2">${flake}</svg>`).join('');
  route();
})();
</script>
</body>
</html>
